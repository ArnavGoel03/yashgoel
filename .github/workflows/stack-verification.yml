name: Stack verification
on:
  pull_request:
  workflow_dispatch:
    inputs:
      browser_scope:
        description: Browser acceptance scope (full remains the default)
        type: choice
        default: full
        options: [full, interactions]
permissions:
  contents: read
concurrency:
  group: stack-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b
        with:
          version: 12.4.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test && pnpm run lint && pnpm run typecheck && pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser acceptance
        env:
          BROWSER_SCOPE: ${{ inputs.browser_scope || 'full' }}
        run: |
          if [ "$BROWSER_SCOPE" = "interactions" ]; then
            pnpm exec playwright test browser-tests/stack.e2e.mjs
          else
            pnpm exec playwright test
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stack-browser-evidence
          path: test-results/
          retention-days: 7
